# Manifest of public images to sync from overseas sources into the local
# mirror registry.
#
# This is the single source of truth for the whole project: adding or
# removing an image only requires editing this file, never the scripts.
#
# Each image entry:
#   - name:   source-derived mirror name with the leading registry hostname
#             stripped (namespace/org is kept). Must be globally unique across
#             this file. Target repositories replace internal '/' characters
#             with '-' because the Aliyun target namespaces only permit a
#             single repository path segment. E.g. bitnami/mongodb becomes
#             bitnami-mongodb and browserless/chromium becomes
#             browserless-chromium.
#   - source: full upstream pull path, including registry hostname when the
#             image isn't on docker.io (docker.io is the implicit default,
#             so "name" alone is a valid pull reference for it). Can be
#             omitted whenever `name` already resolves correctly on
#             docker.io (true for both official images like `redis` and
#             namespaced ones like `bitnami/mongodb`); required for
#             anything hosted elsewhere (ghcr.io, gcr.io, quay.io, ...).
#   - tags:   tags to sync, based on what's actually used by our projects
#             (not a full-repo sync).
#
# To find new candidate images: run scripts/discover.sh. It scans every
# Dockerfile/docker-compose file under the workspace and prints images not
# yet listed here, for manual review before adding them to a category.

categories:
  runtime:
    description: "Language runtimes / base OS images"
    images:
      - name: node
        tags: ["16-alpine3.14", "18-alpine", "20-slim", "22-alpine"]
      - name: nginx
        tags: ["alpine", "1.21", "latest", "stable-alpine"]
      - name: ubuntu
        tags: ["20.04", "24.04", "jammy"]
      - name: python
        tags: ["3.11-slim", "3.11-slim-bookworm", "3.12-slim-bookworm"]
      - name: debian
        tags: ["bookworm-slim"]

  database:
    description: "Databases"
    images:
      - name: mariadb
        tags: ["11.6", "latest"]
      - name: postgres
        tags: ["17"]
      # bitnami/mongodb:6.0 is gone from Docker Hub -- Bitnami discontinued
      # free versioned tags there and now only publishes `latest` (plus
      # sha256-* content-addressed tags) under docker.io/bitnami/*. A frozen,
      # unmaintained copy of the old versioned tags lives under
      # docker.io/bitnamilegacy/* (confirmed bitnamilegacy/mongodb:6.0.9
      # exists) if a pinned tag is really needed. This also means the
      # `income` project's own docker-compose.yml pull of
      # docker.io/bitnami/mongodb:6.0 is broken independent of this repo --
      # needs a decision there (repin to bitnamilegacy, move to a current
      # Bitnami Secure Images tag, or switch to the official `mongo` image)
      # before an entry is re-added here.

  cache:
    description: "Cache / message queues"
    images:
      - name: redis
        tags: ["alpine"]
      - name: rabbitmq
        tags: ["3.6.12"]

  misc:
    description: "Other middleware / tool images"
    images:
      - name: instrumentisto/haraka
        tags: ["latest"]
      - name: kopia/kopia
        tags: ["latest"]
      - name: browserless/chromium
        source: ghcr.io/browserless/chromium
        tags: ["latest"]
