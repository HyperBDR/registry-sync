name: Sync images

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - images.yaml
      - scripts/**
      - .github/workflows/sync.yml
  # Uncomment once the sync cadence is decided (e.g. weekly):
  # schedule:
  #   - cron: "0 2 * * 1"

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure yq is available
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Install regsync
        uses: regclient/actions/regsync-installer@main
        with:
          release: v0.11.5

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version

      - name: Sync images to target registry
        env:
          REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_HOST: ${{ vars.REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_HOST }}
          REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_REPO: ${{ vars.REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_REPO }}
          REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_USERNAME: ${{ secrets.REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_USERNAME }}
          REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_PASSWORD: ${{ secrets.REGISTRY_ALIYUN_CN_BEIJING_ONEPROLABS_PASSWORD }}
          REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_HOST: ${{ vars.REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_HOST }}
          REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_REPO: ${{ vars.REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_REPO }}
          REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_USERNAME: ${{ secrets.REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_USERNAME }}
          REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_PASSWORD: ${{ secrets.REGISTRY_ALIYUN_CN_BEIJING_CLOUD2AI_PASSWORD }}
        run: ./scripts/sync.sh
