name: Sync images

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - images.yaml
      - scripts/**
      - .github/workflows/sync.yml
  # Uncomment once the sync cadence is decided (e.g. weekly):
  # schedule:
  #   - cron: "0 2 * * 1"

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure yq is available
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Resolve pinned image-syncer version
        id: image_syncer
        run: |
          version="$(grep -oP '(?<=IMAGE_SYNCER_VERSION=")[^"]+' scripts/sync.sh)"
          echo "Pinned version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only the image-syncer binary itself is cached here -- never cache
      # .sync-work/ as a whole, since sync.sh also writes a plaintext
      # registry password into that directory (auth.yaml) and a GitHub
      # Actions cache is readable by anyone who can run a workflow in this
      # repo.
      - name: Cache image-syncer binary
        uses: actions/cache@v4
        with:
          path: .sync-work/image-syncer
          key: image-syncer-${{ steps.image_syncer.outputs.version }}

      - name: Sync images to target registry
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REPO: ${{ secrets.REPO }}
          SECONDARY_REGISTRY: registry.cn-beijing.aliyuncs.com
          SECONDARY_REGISTRY_USERNAME: xiaoquqi@gmail.com
          SECONDARY_REGISTRY_PASSWORD: ${{ secrets.SECONDARY_REGISTRY_PASSWORD }}
          SECONDARY_REPO: cloud2ai
        run: ./scripts/sync.sh "$REGISTRY" "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" "$REPO"
